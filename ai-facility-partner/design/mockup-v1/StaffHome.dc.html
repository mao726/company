<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>

<p style="margin: 0; padding: 8px 12px; background: #FFF3D6; border-radius: 6px; color: #7A4100">「受診日がちがうようです。もう一度確認してください」<br>佐藤 主任より</p>
<button type="button" style="height: 56px; border: none; border-radius: 6px; background: #0B5E8A; color: #FFFFFF; font: inherit; font-weight: 700">もう一度提出する</button>
</article>
</section>

<section aria-labelledby="h-today" style="display: flex; flex-direction: column; gap: 8px">

<span>依頼：佐藤 主任</span>
</div>
<button type="button" style="height: 56px; border: none; border-radius: 6px; background: #0B5E8A; color: #FFFFFF; font: inherit; font-weight: 700">提出する</button>

<section aria-labelledby="h-request" style="display: flex; flex-direction: column; gap: 8px">

<span>居室の温度・湿度の確認</span>
<button type="button" style="min-width: 88px; height: 44px; border: 1px solid #0B5E8A; border-radius: 6px; background: #FFFFFF; color: #0B5E8A; font: inherit; font-weight: 700">完了</button>
</li>
<li style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px; border-bottom: 1px solid #DADADA">

</li>
<li style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px; min-height: 44px">
