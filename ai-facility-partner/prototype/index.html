<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI施設運営パートナー 試作品</title>
<style>
:root{
  --text:#1A1A1A; --text-2:#4D4D4D; --muted:#5C5C5C;
  --primary:#0B5E8A; --primary-dark:#084A6D;
  --bg:#F5F6F7; --surface:#FFFFFF; --line:#DADADA; --input:#767676;
  --danger:#B42318; --danger-bg:#FDECEA;
  --warn:#7A4100; --warn-bg:#FFF3D6;
  --info:#1849A9; --info-bg:#E8F0FE;
  --focus:#FFD43B;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;font-size:16px;line-height:1.7}
a{color:var(--primary)}a:hover{color:var(--primary-dark)}
h1{font-size:24px;line-height:1.4;margin:0}
h2{font-size:20px;line-height:1.5;margin:0}
h3{font-size:18px;line-height:1.5;margin:0}
p{margin:0}
:focus-visible{outline:2px solid #000;outline-offset:2px;box-shadow:0 0 0 6px var(--focus)}
h1[tabindex="-1"]:focus,h2[tabindex="-1"]:focus,main[tabindex="-1"]:focus{outline:none;box-shadow:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-9999px;top:8px}
.skip:focus{left:16px;background:#fff;padding:8px 12px;z-index:20}
.text-2{color:var(--text-2)} .text-muted{color:var(--muted)}
.due-soon{color:var(--warn);font-weight:700}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.row-between{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-sm{display:flex;flex-direction:column;gap:4px}

/* 試作品の操作バー */
.proto-bar{background:#1A1A1A;color:#fff;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.proto-bar a{color:#fff}
.proto-bar label{display:inline-flex;align-items:center;gap:8px}
.proto-bar select{font:inherit;min-height:44px;padding:0 8px;border-radius:6px;border:1px solid #fff;background:#1A1A1A;color:#fff}
.pbtn{min-height:44px;padding:0 12px;border:1px solid #fff;border-radius:6px;background:transparent;color:#fff;font:inherit;cursor:pointer}
.proto-label{font-weight:700;border:1px solid #fff;border-radius:4px;padding:0 8px}

/* 管理者の画面 */
.wrap{max-width:1200px;margin:0 auto;padding:0 32px}
.site-header{background:var(--surface);border-bottom:1px solid var(--line)}
.header-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:baseline;gap:12px;flex:1 1 auto}
.brand-name{font-size:20px;font-weight:700}
.main-nav{display:flex;flex-wrap:wrap;gap:4px}
.main-nav a{padding:10px 14px;border-radius:6px;color:var(--text);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.main-nav a[aria-current="page"]{background:var(--info-bg);color:var(--info);font-weight:700}
.main{padding-top:24px;padding-bottom:48px;display:flex;flex-direction:column;gap:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 20px}
.grid-cards{display:flex;flex-wrap:wrap;gap:16px}
.grid-cards>*{flex:1 1 240px;min-width:0}
.cols{display:flex;flex-wrap:wrap;gap:16px}
.cols>*{flex:1 1 420px;min-width:0}
.stat-card{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--text)}
.stat-card:hover{border-color:var(--primary);color:var(--text)}
.stat-card.alert{border:2px solid var(--danger)}
.stat-num{font-size:32px;font-weight:700;line-height:1.3}
.list{list-style:none;margin:0;padding:0}
.list>li{padding:10px 0;border-bottom:1px solid var(--line)}
.list>li:last-child{border-bottom:none}
.list.card{padding:0 20px}
.split{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.split>.main-col{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px}
.split>.side-col{flex:1 1 340px;min-width:0}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tr.is-current td{background:var(--info-bg)}
.list>li.is-current{background:var(--info-bg);margin:0 -20px;padding-left:20px;padding-right:20px}

/* 部品 */
.btn{min-height:48px;padding:0 20px;border-radius:6px;font:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--primary);background:var(--surface);color:var(--primary);text-decoration:none}
.btn:hover{color:var(--primary-dark);border-color:var(--primary-dark)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark);color:#fff}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-danger:hover{background:#8f1b13;color:#fff}
.btn-text{border:none;background:none;color:var(--primary);text-decoration:underline;padding:0 8px;min-height:44px;display:inline-flex;align-items:center;font:inherit;font-weight:400;cursor:pointer}
.btn-lg{min-height:56px;width:100%}
.btn-sm{min-height:44px;padding:0 14px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;line-height:1.5;white-space:nowrap}
.tag-info{background:var(--info-bg);color:var(--info)}
.tag-warn{background:var(--warn-bg);color:var(--warn)}
.tag-danger{background:var(--danger-bg);color:var(--danger)}
.tag-muted{background:var(--bg);color:var(--muted);border:1px solid var(--input)}
.tag-outline{border:1px solid var(--input);color:var(--text-2);border-radius:4px;padding:0 8px;white-space:nowrap}
.tag-plain{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border:1px solid var(--input);border-radius:999px;background:var(--surface);color:var(--text);font:inherit;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.notice{padding:12px 16px;border-radius:6px;display:flex;gap:8px;align-items:flex-start}
.notice-warn{background:var(--warn-bg);color:var(--warn)}
.notice-info{background:var(--info-bg);color:var(--info)}
.notice-plain{background:var(--bg)}
.toast{padding:12px 16px;border-radius:6px;background:var(--info-bg);color:var(--info);font-weight:700}
.toast-error{background:var(--danger-bg);color:var(--danger)}
.field{display:flex;flex-direction:column;gap:4px}
.lbl{font-weight:700}
.req{font-weight:400;color:var(--text-2)}
.hint{color:var(--text-2)}
.err{color:var(--danger)}
input[type=text],input[type=date],select,textarea{font:inherit;min-height:48px;padding:8px 12px;border:1px solid var(--input);border-radius:6px;background:var(--surface);color:var(--text);max-width:100%}
textarea{min-height:96px;resize:vertical;width:100%}
input[type=file]{font:inherit;min-height:48px;max-width:100%}
input[type=file]::file-selector-button{font:inherit;font-weight:700;min-height:44px;padding:0 16px;margin-right:12px;border:1px solid var(--primary);border-radius:6px;background:var(--surface);color:var(--primary);cursor:pointer}
input[type=text]{width:100%}
.input-error{border:2px solid var(--danger) !important}
fieldset{border:none;margin:0;padding:0}
legend{font-weight:700;padding:0;margin-bottom:4px}
.radio{display:flex;align-items:flex-start;gap:10px;min-height:44px;padding:6px 0}
.radio input{width:22px;height:22px;margin-top:3px;flex:none}
input[type=checkbox]{width:24px;height:24px}
.file-btn{position:relative}
.file-btn:focus-within{outline:2px solid #000;outline-offset:2px;box-shadow:0 0 0 6px var(--focus)}
.file-btn input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.dl{display:grid;grid-template-columns:max-content 1fr;gap:8px 16px;margin:0}
.dl dt{color:var(--text-2)}
.dl dd{margin:0}
.history{list-style:none;margin:0;padding:0}
.history li{padding:6px 0;border-bottom:1px solid var(--line)}
.history li:last-child{border-bottom:none}
.card ul:not(.list):not(.history){margin:0;padding-left:1.5em}

/* 職員の画面（スマホ） */
.staff-shell{max-width:480px;margin:0 auto;min-height:calc(100vh - 60px);display:flex;flex-direction:column;font-size:17px;background:var(--bg)}
.staff-header{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px}
.staff-main{flex:1;padding:16px;display:flex;flex-direction:column;gap:20px}
.tabbar{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:64px;color:var(--text-2);text-decoration:none;font-size:16px}
.tabbar a[aria-current="page"]{color:var(--primary);font-weight:700}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px}
.section-title{display:inline-flex;align-items:center;gap:6px}
.quote{padding:8px 12px;background:var(--warn-bg);border-radius:6px;color:var(--warn)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px}
.day{display:flex;flex-direction:column;align-items:center;min-height:64px;padding:4px 0;border-radius:6px}
.day.today{background:var(--primary);color:#fff;font-weight:700}
.dot{width:6px;height:6px;border-radius:3px;background:var(--text-2)}
.day.today .dot{background:#fff}
.checklist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.checklist li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;border-bottom:1px solid var(--line);min-height:60px}
.checklist li:last-child{border-bottom:none}
.flow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:16px;min-height:560px;width:100%;max-width:480px;margin:0 auto}
.flow .bottom{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.thumb{height:180px;border:1px solid var(--line);border-radius:8px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text-2);padding:8px;text-align:center;word-break:break-all}
.done-mark{width:72px;height:72px;border-radius:36px;border:2px solid var(--text);display:inline-flex;align-items:center;justify-content:center}

/* 確認ダイアログ */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.dialog{background:var(--surface);border-radius:8px;max-width:520px;width:100%;padding:24px;display:flex;flex-direction:column;gap:16px}
.dialog-actions{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}

@media (max-width:640px){.wrap{padding:0 16px}.dl{grid-template-columns:1fr}}
@media print{.proto-bar,.site-header,.tabbar,.no-print{display:none !important}body{background:#fff}.card{border:none}}
</style>
</head>
<body>
<a class="skip" href="#main" data-action="skip">本文へ移動</a>
<div id="proto-bar" class="proto-bar" role="region" aria-label="試作品の操作"></div>
<div id="app"></div>
<div id="live" class="sr-only" aria-live="polite"></div>
<div id="dialog-root"></div>
<script>
'use strict';
(function(){
/* ============================================================
   AI施設運営パートナー 試作品 v0
   - このファイルだけで動きます（サーバー・インターネット不要）
   - データはこの端末のブラウザの中（localStorage）にだけ保存します
   - すべて架空のデータです。実在の人の情報は入力しないでください
   ============================================================ */
var STORAGE_KEY = 'afp-prototype-v0';
var WEEK = ['日','月','火','水','木','金','土'];
var CATEGORIES = ['行政提出','委員会','研修','点検','人事','会計','その他'];
var STATUS_LABEL = {not_started:'未着手',in_progress:'進行中',awaiting_submission:'提出待ち',awaiting_approval:'承認待ち',returned:'差し戻し',completed:'完了',on_hold:'保留'};
var BASIS_LABEL = {law:'法令',notice:'行政通知',corporate_rule:'法人規程',facility_rule:'施設ルール',unverified:'未確認'};
var DATA_CLASS = {
  c1:{label:'一般（業務の書類）',hint:'研修レポート、点検の記録など'},
  c2:{label:'職員の基本情報を含む',hint:'氏名・所属が書かれた書類など'},
  c4:{label:'健康情報など',hint:'健康診断の結果などはファイルを受け取らず、「提出した」ことだけを記録します'}
};

var I = {
  alert:'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
  excl:'<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="6" x2="12" y2="13"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>',
  check:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  bigcheck:'<svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  warn:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  back:'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>',
  home:'<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>',
  list:'<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="13" y2="16"/></svg>',
  upload:'<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><polyline points="7 9 12 4 17 9"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>',
  bell:'<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
  camera:'<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="4"/></svg>',
  doc:'<svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="14 3 14 9 20 9"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>'
};

var app = document.getElementById('app');
var protoBar = document.getElementById('proto-bar');
var dialogRoot = document.getElementById('dialog-root');
var live = document.getElementById('live');
var data = null;
var storageOK = true;
var ui = {toast:null, flow:{}, filter:{}, selected:{}, panel:null, formErr:null, form:null, dialog:null, lastPath:null};

/* ---------------- 共通の小さな関数 ---------------- */
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function byId(list,id){for(var i=0;i<list.length;i++){if(list[i].id===id)return list[i];}return null;}
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseDate(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function addDays(s,n){var d=parseDate(s);d.setDate(d.getDate()+n);return ymd(d);}
function diffDays(a,b){return Math.round((parseDate(b)-parseDate(a))/86400000);}
function realToday(){return ymd(new Date());}
function today(){return addDays(realToday(),(data&&data.todayOffset)||0);}
function fmtDate(s){if(!s)return '';var d=parseDate(s);return (d.getMonth()+1)+'月'+d.getDate()+'日('+WEEK[d.getDay()]+')';}
function nowStamp(){var t=new Date();return today()+'T'+pad(t.getHours())+':'+pad(t.getMinutes());}
function stamp(dateStr,time){return dateStr+'T'+(time||'09:00');}
function fmtStamp(s){if(!s)return '';var p=s.split('T');return fmtDate(p[0])+' '+(p[1]||'');}
function rel(due){var n=diffDays(today(),due);if(n<0)return {text:(-n)+'日超過',kind:'over'};if(n===0)return {text:'今日まで',kind:'today'};return {text:'あと'+n+'日',kind:n<=3?'soon':'later'};}
function byDue(a,b){return a.dueOn<b.dueOn?-1:a.dueOn>b.dueOn?1:0;}
function nid(prefix){data.seq=(data.seq||1000)+1;return prefix+'-'+data.seq;}
function staff(id){return byId(data.staff,id);}
function staffName(id){if(id==='system')return '自動処理';var s=staff(id);return s?s.name:'（不明）';}
function dept(id){return byId(data.departments,id);}
function deptName(id){var d=dept(id);return d?d.name:'';}
function me(){return staff(data.currentUserId);}
function isManager(u){return u.role!=='STAFF';}
function isFacilityAdmin(u){return u.role==='FACILITY_DIRECTOR'||u.role==='ADMIN_MANAGER';}
function reqById(id){return byId(data.requests,id);}
function reqOf(x){return reqById(x.requestId);}
function taskById(id){return byId(data.tasks,id);}
function targetsOf(r){return data.targets.filter(function(x){return x.requestId===r.id;});}
function qOf(r){return r.question||{text:'「'+r.title+'」は済みましたか',yes:'済みました',no:'まだです',date:'実施日',what:'済んだかどうかと実施日（書類は出しません）',laterTitle:'済んでから報告してください',later:'済んだら、もう一度この画面から報告してください。'};}
function nameTitle(id){var s=staff(id);return s?s.name+'さん（'+s.title+'）':'';}

/* ---------------- 保存と読み込み ---------------- */
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data));storageOK=true;}catch(e){storageOK=false;}}
function load(){
  try{var raw=localStorage.getItem(STORAGE_KEY);if(raw){var d=JSON.parse(raw);if(d&&d.version===1){data=d;return;}}}catch(e){storageOK=false;}
  seed();save();
}

/* ---------------- 操作の記録と通知 ---------------- */
function log(action,target,actorId){data.audit.push({id:nid('a'),at:nowStamp(),actorId:actorId||data.currentUserId,action:action,target:target});}
function notify(toId,title,body,link,urgent){var s=staff(toId);if(!s||!s.hasLogin||s.status!=='active')return false;data.notifications.push({id:nid('n'),toId:toId,at:nowStamp(),title:title,body:body||'',link:link||'#/',urgent:!!urgent,readAt:null});return true;}
function unreadCount(u){return data.notifications.filter(function(n){return n.toId===u.id&&!n.readAt;}).length;}

function mkTask(o){

/* ---------------- 毎日の自動処理（繰り返し業務・督促） ---------------- */
function ensureSeries(){
  var T=today();
  data.series.forEach(function(se){
    var dates=[];
    if(se.occurrence==='daily'){dates=[T];}
    else if(se.occurrence==='monthly'){
      var p=T.split('-').map(Number);
      for(var k=0;k<2;k++){var yy=p[0]+Math.floor((p[1]-1+k)/12);var mm=((p[1]-1+k)%12)+1;var last=new Date(yy,mm,0).getDate();var dd=Math.min(se.day,last);var ds=yy+'-'+pad(mm)+'-'+pad(dd);if(ds>=T)dates.push(ds);}
    }
    dates.forEach(function(dt){
      var exists=data.tasks.some(function(t){return t.seriesId===se.id&&t.occurrenceDate===dt;});
      if(exists)return; /* 同じ日の分は1件だけ（取り消した回も作り直さない） */
      var t=mkTask({title:se.title,category:se.category,seriesId:se.id,occurrenceDate:dt,isChecklist:se.isChecklist,assignee:se.assignee?{type:se.assignee.type,id:se.assignee.id}:null,dueOn:dt,basisType:'facility_rule'});
      t.createdById='system';
      data.tasks.push(t);
    });
  });
}
function escalationCandidates(r){
  var n=data.settings.escalateAfter;
  return targetsOf(r).filter(function(x){
    if(!(x.status==='not_submitted'||x.status==='returned'))return false;
    if(x.hasLogin)return (x.reminders||0)>=n;
    return (r.rounds||0)>=n;
  });
}
function checkEscalation(r){
  var c=escalationCandidates(r);
  if(c.length&&!r.escalatedOn){
    r.escalatedOn=today();
    notify(r.requesterId,'直接声をかけてください：'+r.title,'督促しても未提出の人、通知が届かない人が'+c.length+'名います','#/requests/'+r.id,true);
    log('声かけのお知らせ',r.title+'（'+c.length+'名）','system');
  }
}
function autoReminders(){
  var T=today();
  data.requests.filter(function(r){return r.status==='open'&&r.reminder==='default';}).forEach(function(r){
    var off=diffDays(r.dueOn,T);
    if([-3,-1,0,1].indexOf(off)<0){checkEscalation(r);return;}
    var key=String(off);
    r.roundKeys=r.roundKeys||[];
    if(r.roundKeys.indexOf(key)>=0){checkEscalation(r);return;}
    r.roundKeys.push(key);r.rounds=(r.rounds||0)+1;
    var label=off<0?('期限まであと'+(-off)+'日です'):off===0?'今日が期限です':'期限を過ぎています';
    var sent=0;
    targetsOf(r).forEach(function(x){
      if(!(x.status==='not_submitted'||x.status==='returned'))return;
      if(notify(x.staffId,'提出の期限：'+r.title,label,'#/submit/'+x.id,off>=0)){x.reminders=(x.reminders||0)+1;sent++;}
    });
    if(sent)log('督促を自動送信',r.title+'（'+sent+'名）','system');
    checkEscalation(r);
  });
}
function runDailyJobs(){ensureSeries();autoReminders();save();}

/* ---------------- 見える範囲（権限の簡易版） ---------------- */
function isAssignee(u,t){if(!t.assignee)return false;if(t.assignee.type==='staff')return t.assignee.id===u.id;return t.assignee.id===u.deptId;}
function taskVisible(u,t){
  if(t.cancelledAt)return false;
  if(isFacilityAdmin(u))return true;
  if(u.role==='DEPARTMENT_MANAGER')return t.departmentId===u.deptId||isAssignee(u,t)||t.requestedById===u.id||(t.approval&&t.approval.approverId===u.id);
  return isAssignee(u,t)||(t.approval&&t.approval.approverId===u.id);
}
function isOpenTask(t){return !t.cancelledAt&&t.status!=='completed';}
function canWork(u,t){return isAssignee(u,t)&&['not_started','in_progress','returned','awaiting_submission'].indexOf(t.status)>=0;}
function canManageTask(u,t){return isFacilityAdmin(u)||(u.role==='DEPARTMENT_MANAGER'&&t.departmentId===u.deptId);}
function visibleRequests(u){return data.requests.filter(function(r){return isFacilityAdmin(u)||r.requesterId===u.id||r.reviewerId===u.id;});}
function canManageRequest(u,r){return isFacilityAdmin(u)||r.requesterId===u.id||r.reviewerId===u.id;}
function myApprovals(u){
  var tasks=data.tasks.filter(function(t){return t.status==='awaiting_approval'&&t.approval&&t.approval.status==='pending'&&t.approval.approverId===u.id;});
  var targets=data.targets.filter(function(x){var r=reqOf(x);return x.status==='submitted'&&r.status==='open'&&r.reviewerId===u.id;});
  return {tasks:tasks,targets:targets,count:tasks.length+targets.length};
}
function allApprovalsCount(u){return myApprovals(u).count+otherApprovals(u).length;}

/* ---------------- 表示の部品 ---------------- */
function taskStatusTag(t){
  var s=t.status;
  if(s==='completed')return '<span class="tag-plain">'+I.check+'完了</span>';
  if(s==='not_started')return '<span>未着手</span>';
  if(s==='returned')return '<span class="tag tag-warn">'+I.excl+'差し戻し</span>';
  if(s==='on_hold')return '<span class="tag tag-muted">保留</span>';
  return '<span class="tag tag-info">'+esc(STATUS_LABEL[s])+'</span>';
}
function dueBadge(dueOn,open){
  if(!open)return '';
  var r=rel(dueOn);
  if(r.kind==='over')return '<span class="tag tag-danger">'+I.excl+esc(r.text)+'</span>';
  if(r.kind==='today'||r.kind==='soon')return '<span class="due-soon">'+esc(r.text)+'</span>';
  return '<span class="text-2">'+esc(r.text)+'</span>';
}
function targetTag(x){
  var r=reqOf(x);
  if(x.status==='not_submitted'){if(r.dueOn<today())return '<span class="tag tag-danger">'+I.excl+'未提出（期限超過）</span>';return '<span>未提出</span>';}
  if(x.status==='submitted')return '<span class="tag tag-info">提出済み（確認待ち）</span>';
  if(x.status==='approved')return '<span class="tag-plain">'+I.check+'承認済み</span>';
  if(x.status==='returned')return '<span class="tag tag-warn">'+I.excl+'差し戻し</span>';
  return '<span class="text-muted">対象外'+(x.excludedReason?'（'+esc(x.excludedReason)+'）':'')+'</span>';
}
function assigneeLabel(t){
  if(!t.assignee)return '<span class="tag tag-warn">'+I.excl+'担当者未設定</span>';
  if(t.assignee.type==='dept')return esc(deptName(t.assignee.id))+'（部署）';
  var s=staff(t.assignee.id);var extra='';
  if(s&&s.status!=='active')extra=' <span class="tag tag-muted">'+(s.status==='on_leave'?'休職中':'退職')+'</span>';
  return esc(staffName(t.assignee.id))+extra;
}
function toastHtml(){if(!ui.toast)return '';return '<div class="toast'+(ui.toast.kind==='error'?' toast-error':'')+'" role="status">'+esc(ui.toast.text)+'</div>';}
function toast(text,kind){ui.toast={text:text,kind:kind||'ok',path:null};}
function go(path){ui.panel=null;ui.formErr=null;ui.form=null;if(ui.toast)ui.toast.path=path;if(location.hash==='#'+path){render();}else{location.hash=path;}}
function pageTitle(text){return '<h1 id="page-title" tabindex="-1">'+esc(text)+'</h1>';}
function fieldErr(name){if(ui.formErr&&ui.formErr[name])return '<span class="err" id="err-'+name+'">＊'+esc(ui.formErr[name])+'</span>';return '';}
function formVal(name,def){if(ui.form&&ui.form[name]!=null)return ui.form[name];return def==null?'':def;}

/* ---------------- 画面：管理者ダッシュボード ---------------- */
function autoChecks(u,open,reqs){
  var list=[];
  var gov=open.filter(function(t){return t.category==='行政提出'&&t.basisType==='unverified';});
  if(gov.length)list.push('根拠が「未確認」の行政提出の業務が '+gov.length+'件あります');
  var away=open.filter(function(t){if(!t.assignee||t.assignee.type!=='staff')return false;var s=staff(t.assignee.id);return s&&s.status!=='active';});
  if(away.length)list.push('休職中・退職した職員が担当の業務が '+away.length+'件あります（担当の変更が必要です）');
  var esc2=0;reqs.forEach(function(r){esc2+=escalationCandidates(r).length;});
  if(esc2)list.push('督促しても未提出の人、通知が届かない人が '+esc2+'名います（直接声をかけてください）');
  var missed=open.filter(function(t){return t.isChecklist&&t.dueOn<today();}).length;
  if(missed)list.push('前日までの毎日のチェックリストに、未実施が '+missed+'件あります');
  return list;
}
function myTodoHtml(u){
  var T=today();
  var tasks=data.tasks.filter(function(t){return isOpenTask(t)&&isAssignee(u,t)&&!t.isChecklist&&t.status!=='awaiting_approval'&&t.status!=='on_hold'&&(t.status==='returned'||diffDays(T,t.dueOn)<=3);}).sort(byDue);
  var subs=data.targets.filter(function(x){var r=reqOf(x);return x.staffId===u.id&&r.status==='open'&&(x.status==='not_submitted'||x.status==='returned');});
  var appr=myApprovals(u).count;
  var items=[];
  if(appr)items.push('<li class="row"><a href="#/approvals" style="flex:1 1 200px;font-weight:500">あなたの承認待ち</a><span>'+appr+'件</span></li>');
  subs.forEach(function(x){var r=reqOf(x);items.push('<li class="row"><a href="#/submit/'+x.id+'" style="flex:1 1 200px;font-weight:500">'+esc(r.title)+'（提出）</a>'+(x.status==='returned'?'<span class="tag tag-warn">'+I.excl+'差し戻し</span>':'')+dueBadge(r.dueOn,true)+'</li>');});
  tasks.forEach(function(t){items.push('<li class="row"><a href="#/tasks/'+t.id+'" style="flex:1 1 200px;font-weight:500">'+esc(t.title)+'</a>'+(t.status==='returned'?'<span class="tag tag-warn">'+I.excl+'差し戻し</span>':'')+dueBadge(t.dueOn,true)+'</li>');});
  return '<section aria-labelledby="h-mine" class="card stack"><h2 id="h-mine" style="font-size:18px">あなたのやること（3日以内・'+items.length+'件）</h2>'+(items.length?'<ul class="list">'+items.join('')+'</ul>':'<p class="text-2">3日以内にあなたがやることはありません</p>')+'</section>';
}
function viewDashboard(u){
  var T=today();
  var vis=data.tasks.filter(function(t){return taskVisible(u,t);});
  var open=vis.filter(isOpenTask);
  var overdue=open.filter(function(t){return t.dueOn<T&&!t.isChecklist;}).sort(byDue);
  var hold=overdue.filter(function(t){return t.status==='on_hold';}).length;
  var mine=myApprovals(u).count;
  var pendAll=allApprovalsCount(u);
  var reqs=visibleRequests(u).filter(function(r){return r.status==='open';});
  var unsub=0,unsubReq=0;
  reqs.forEach(function(r){var n=targetsOf(r).filter(function(x){return x.status==='not_submitted'||x.status==='returned';}).length;unsub+=n;if(n)unsubReq++;});
  var unassigned=open.filter(function(t){return !t.assignee;});
  var todayList=open.filter(function(t){return t.dueOn===T&&!t.isChecklist;}).sort(byDue);
  var soon=open.filter(function(t){return t.dueOn>T&&diffDays(T,t.dueOn)<=3&&!t.isChecklist;}).sort(byDue);
  var events=open.filter(function(t){return (t.category==='委員会'||t.category==='研修')&&t.dueOn>=T&&diffDays(T,t.dueOn)<=30;}).sort(byDue);
  var checks=autoChecks(u,open,reqs);
  var ym=T.slice(0,7);
  var doneMonth=vis.filter(function(t){return t.status==='completed'&&!t.isChecklist&&(t.completedAt||'').slice(0,7)===ym;}).length;
  var cl=vis.filter(function(t){return t.isChecklist&&t.dueOn===T;});
  var clDone=cl.filter(function(t){return t.status==='completed';}).length;
  var weekStart=addDays(T,-((parseDate(T).getDay()+6)%7));var weekEnd=addDays(weekStart,6);
  var weekOpen=open.filter(function(t){return !t.isChecklist&&t.dueOn>=weekStart&&t.dueOn<=weekEnd;}).length;
  var monthOpen=open.filter(function(t){return !t.isChecklist&&t.dueOn.slice(0,7)===ym;}).length;

  function row(t){return '<li class="row"><a href="#/tasks/'+t.id+'" style="flex:1 1 200px;font-weight:500">'+esc(t.title)+'</a><span class="text-2">'+assigneeLabel(t)+'</span>'+taskStatusTag(t)+'</li>';}
  function soonRow(t){
    var gov=t.category==='行政提出'?'<span class="tag-outline">行政提出</span>':'';
    var sub='';
    if(t.category==='行政提出'){sub='<div class="row text-2">'+(t.basisType==='unverified'?'<span class="tag-plain" style="color:var(--warn)">'+I.warn+'根拠：未確認</span>':'<span>根拠：'+esc(BASIS_LABEL[t.basisType])+'</span>')+'<span>控え：'+(t.gov&&t.gov.copyFile?'登録済み':'未登録')+'</span></div>';}
    return '<li class="stack-sm"><div class="row">'+gov+'<a href="#/tasks/'+t.id+'" style="flex:1 1 200px;font-weight:500">'+esc(t.title)+'</a>'+dueBadge(t.dueOn,true)+'</div>'+sub+'</li>';
  }
  var scope=u.role==='DEPARTMENT_MANAGER'?'<p class="text-2">'+esc(deptName(u.deptId))+'に関係する業務を表示しています</p>':'';
  return pageTitle('施設の状況')+scope+
  '<section aria-labelledby="h-urgent" class="stack"><h2 id="h-urgent">要対応</h2><div class="grid-cards">'+
    '<a href="#/tasks" data-action="goto-filter" data-value="overdue" class="card stat-card'+(overdue.length?' alert':'')+'">'+
      '<span class="tag-plain" style="font-weight:700;'+(overdue.length?'color:var(--danger)':'')+'">'+(overdue.length?I.alert:'')+'期限超過</span>'+
      '<span><span class="stat-num">'+overdue.length+'</span> 件</span><span class="text-2">'+(hold?'うち保留中 '+hold+'件':'保留中はありません')+'</span></a>'+
    '<a href="#/approvals" class="card stat-card"><span style="font-weight:700">承認待ち</span><span><span class="stat-num">'+pendAll+'</span> 件</span><span class="text-2">あなた宛て '+mine+'件</span></a>'+
    '<a href="#/requests" class="card stat-card"><span style="font-weight:700">未提出</span><span><span class="stat-num">'+unsub+'</span> 名</span><span class="text-2">'+unsubReq+'件の提出依頼（延べ人数）</span></a>'+
    '<a href="#/tasks" data-action="goto-filter" data-value="unassigned" class="card stat-card"><span style="font-weight:700">担当者未設定</span><span><span class="stat-num">'+unassigned.length+'</span> 件</span><span class="text-2">'+(unassigned.length?'担当を決めてください':'ありません')+'</span></a>'+
  '</div></section>'+
  myTodoHtml(u)+
  '<div class="cols">'+
    '<section aria-labelledby="h-today" class="card stack"><h2 id="h-today" style="font-size:18px">今日まで（'+todayList.length+'件）</h2>'+(todayList.length?'<ul class="list">'+todayList.slice(0,5).map(row).join('')+'</ul>':'<p class="text-2">今日が期限の業務はありません（0件）</p>')+(todayList.length>5?'<a href="#/tasks">すべて見る（'+todayList.length+'件）</a>':'')+
      (cl.length?'<p class="text-2">今日のチェックリスト（介護部）：'+cl.length+'件中 '+clDone+'件完了</p>':'')+'</section>'+
    '<section aria-labelledby="h-soon" class="card stack"><h2 id="h-soon" style="font-size:18px">期限が近い（3日以内・'+soon.length+'件）</h2>'+(soon.length?'<ul class="list">'+soon.slice(0,5).map(soonRow).join('')+'</ul>':'<p class="text-2">3日以内が期限の業務はありません（0件）</p>')+'</section>'+
  '</div>'+
  '<div class="cols">'+
    '<section aria-labelledby="h-events" class="card stack"><h2 id="h-events" style="font-size:18px">今後30日の委員会・研修</h2>'+(events.length?'<ul class="list">'+events.map(function(t){return '<li class="row"><span class="text-2" style="min-width:120px">'+esc(fmtDate(t.dueOn))+'</span><a href="#/tasks/'+t.id+'">'+esc(t.title)+'</a></li>';}).join('')+'</ul>':'<p class="text-2">予定はありません</p>')+'</section>'+
    '<section aria-labelledby="h-checks" class="card stack"><h2 id="h-checks" style="font-size:18px">自動チェック</h2><p class="text-2">決まったルールで見つけた確認事項です（AI ではありません）</p>'+(checks.length?'<ul class="list">'+checks.map(function(c){return '<li>'+esc(c)+'</li>';}).join('')+'</ul>':'<p>確認事項はありません</p>')+'</section>'+
  '</div>'+
  '<section aria-label="完了と件数のまとめ" class="card row-between"><span class="tag-plain">'+I.check+'今月完了した業務 '+doneMonth+'件</span><span class="text-2">未完了：今週 '+weekOpen+'件 ／ 今月 '+monthOpen+'件</span></section>';
}

/* ---------------- 画面：業務一覧（管理者） ---------------- */
function viewTasks(u){
  var T=today();
  var f=ui.filter.tasks||'open';
  var vis=data.tasks.filter(function(t){return taskVisible(u,t)&&!t.isChecklist;});
  var defs=[
    ['open','未完了',function(t){return isOpenTask(t);}],
    ['overdue','期限超過',function(t){return isOpenTask(t)&&t.dueOn<T;}],
    ['approval','承認待ち',function(t){return t.status==='awaiting_approval';}],
    ['unassigned','担当者未設定',function(t){return isOpenTask(t)&&!t.assignee;}],
    ['mine','自分の担当',function(t){return isOpenTask(t)&&isAssignee(u,t);}],
    ['done','完了',function(t){return t.status==='completed';}],
    ['all','すべて',function(){return true;}]
  ];
  var cur=defs.filter(function(d){return d[0]===f;})[0]||defs[0];
  var rows=vis.filter(cur[2]).sort(byDue);
  return '<div class="row-between">'+pageTitle('業務')+'<a class="btn btn-primary" href="#/tasks/new">業務・依頼を作成</a></div>'+
  '<div class="chips" role="group" aria-label="状態で絞り込む">'+defs.map(function(d){var n=vis.filter(d[2]).length;return '<button type="button" class="chip" data-action="filter" data-scope="tasks" data-value="'+d[0]+'" aria-pressed="'+(d[0]===cur[0])+'">'+esc(d[1])+' '+n+'</button>';}).join('')+'</div>'+
  '<p class="text-2">毎日のチェックリストは、この一覧に含めていません。</p>'+
  (rows.length?'<div class="table-wrap"><table><thead><tr><th scope="col">業務</th><th scope="col">担当</th><th scope="col">期限</th><th scope="col">状態</th></tr></thead><tbody>'+
    rows.map(function(t){return '<tr><td><a href="#/tasks/'+t.id+'" style="font-weight:500">'+esc(t.title)+'</a><br><span class="text-2">'+esc(t.category)+(t.kind==='request'?'・依頼':'')+'</span></td><td>'+assigneeLabel(t)+'</td><td>'+esc(fmtDate(t.dueOn))+'<br>'+dueBadge(t.dueOn,isOpenTask(t))+'</td><td>'+taskStatusTag(t)+'</td></tr>';}).join('')+
  '</tbody></table></div>':'<p class="card">この条件に合う業務はありません（0件）</p>');
}

/* ---------------- 画面：業務詳細 ---------------- */
function viewTaskDetail(u,id){
  var t=taskById(id);
  if(!t||!taskVisible(u,t))return notFound();
  var open=isOpenTask(t);
  var actions='';
  if(t.status==='returned'&&t.returnReason)actions+='<p class="quote">差し戻しの理由：「'+esc(t.returnReason)+'」</p>';
  if(canWork(u,t)){
    var isGov=t.category==='行政提出';
    var needCopy=isGov&&!(t.gov&&t.gov.copyFile);
    actions+='<form data-form="complete-task" data-id="'+t.id+'" class="card stack" novalidate><h2 style="font-size:18px">完了を報告する</h2>'+
      (t.requiresApproval?'<p class="text-2">報告すると、承認者が確認します。</p>':'')+
      (needCopy?'<div class="field"><label class="lbl" for="copy">提出した書類の控え <span class="req">※必須</span></label><span class="hint" id="copy-hint">運営指導で「提出した証拠」として使います。写真でも構いません</span><input id="copy" name="copy" type="file" accept="image/*,application/pdf" aria-describedby="copy-hint'+(ui.formErr&&ui.formErr.copy?' err-copy':'')+'"'+(ui.formErr&&ui.formErr.copy?' class="input-error"':'')+'>'+fieldErr('copy')+'</div>':'')+
      '<div class="field"><label class="lbl" for="comment">コメント <span class="req">※任意</span></label><textarea id="comment" name="comment" rows="3"></textarea></div>'+
      '<div class="row"><button type="submit" class="btn btn-primary">完了を報告する</button>'+(t.status==='not_started'?'<button type="button" class="btn" data-action="start-task" data-id="'+t.id+'">着手する</button>':'')+'</div></form>';
  }
  if(t.status==='awaiting_approval'&&t.approval){
    if(t.approval.approverId===u.id){actions+=reviewTaskPanel(t);}
    else actions+='<p class="notice notice-info">'+esc(staffName(t.approval.approverId))+'さんの承認待ちです</p>';
  }
  if(canManageTask(u,t)&&open){
    var mgr='';
    if(!t.assignee){mgr+='<form data-form="assign-task" data-id="'+t.id+'" class="stack"><div class="field"><label class="lbl" for="assignee">担当を決める</label><select id="assignee" name="assignee">'+assigneeOptions('')+'</select></div><div><button type="submit" class="btn">担当を設定する</button></div></form>';}
    if(t.status==='on_hold'){mgr+='<div class="row"><span>保留の理由：'+esc(t.holdReason)+'</span><button type="button" class="btn" data-action="resume-task" data-id="'+t.id+'">保留を解除する</button></div>';}
    else{mgr+='<form data-form="hold-task" data-id="'+t.id+'" class="stack"><div class="field"><label class="lbl" for="hold">保留にする理由</label><input id="hold" name="reason" type="text"'+(ui.formErr&&ui.formErr.hold?' class="input-error"':'')+'>'+fieldErr('hold')+'</div><div><button type="submit" class="btn">保留にする</button></div></form>';}
    actions+='<section class="card stack" aria-labelledby="h-mgr"><h2 id="h-mgr" style="font-size:18px">管理者の操作</h2>'+mgr+'</section>';
  }
  var gov='';
  if(t.category==='行政提出'){var g=t.gov||{};gov='<section class="card stack" aria-labelledby="h-gov"><h2 id="h-gov" style="font-size:18px">行政提出</h2><dl class="dl"><dt>提出先</dt><dd>'+esc(g.destination||'未入力')+'</dd><dt>提出方法</dt><dd>'+esc(g.method||'未入力')+'</dd><dt>控え</dt><dd>'+(g.copyFile?esc(g.copyFile):'未登録')+'</dd></dl></section>';}
  var hist=t.history.slice().reverse();
  var comments=t.comments.slice().reverse();
  return '<p class="no-print"><a href="'+(isManager(u)?'#/tasks':'#/')+'">'+I.back+'戻る</a></p>'+
  '<div class="stack-sm">'+pageTitle(t.title)+'<div class="row">'+taskStatusTag(t)+dueBadge(t.dueOn,open)+'<span class="text-2">期限 '+esc(fmtDate(t.dueOn))+(t.dueTime?' '+esc(t.dueTime):'')+'</span><span class="tag-outline">'+esc(t.category)+'</span></div></div>'+
  '<div class="split"><div class="main-col">'+
    (t.description?'<section class="card"><p>'+esc(t.description)+'</p></section>':'')+
    gov+actions+
    '<section class="card stack" aria-labelledby="h-hist"><h2 id="h-hist" style="font-size:18px">コメントと履歴</h2>'+
      (comments.length?'<ul class="history">'+comments.map(function(c){return '<li><span class="text-2">'+esc(fmtStamp(c.at))+' '+esc(staffName(c.byId))+'</span><br>'+esc(c.text)+'</li>';}).join('')+'</ul>':'')+
      (hist.length?'<ul class="history">'+hist.map(function(h){return '<li><span class="text-2">'+esc(fmtStamp(h.at))+' '+esc(staffName(h.byId))+'</span>　'+esc(h.action)+(h.reason?'（'+esc(h.reason)+'）':'')+'</li>';}).join('')+'</ul>':'<p class="text-2">まだ履歴はありません</p>')+
    '</section>'+
  '</div><div class="side-col"><section class="card stack" aria-label="業務の情報"><dl class="dl">'+
    '<dt>担当</dt><dd>'+assigneeLabel(t)+'</dd>'+
    (t.departmentId?'<dt>部署</dt><dd>'+esc(deptName(t.departmentId))+'</dd>':'')+
    (t.requestedById?'<dt>依頼した人</dt><dd>'+esc(staffName(t.requestedById))+'</dd>':'')+
    '<dt>承認</dt><dd>'+(t.requiresApproval?'必要（'+esc(staffName(expectedApprover(t)))+'さん）':'不要')+'</dd>'+
    '<dt>根拠</dt><dd>'+(t.basisType==='unverified'?'<span class="tag-plain" style="color:var(--warn)">'+I.warn+'未確認</span>':esc(BASIS_LABEL[t.basisType]))+'</dd>'+
    (t.completedAt?'<dt>完了</dt><dd>'+esc(fmtStamp(t.completedAt))+'（'+esc(staffName(t.completedById))+'）</dd>':'')+
    (t.approval&&t.approval.isSelf?'<dt>注記</dt><dd>自己承認</dd>':'')+
  '</dl></section></div></div>';
}
function assigneeOptions(sel){
  var o='<option value="">選んでください</option>';
  o+='<optgroup label="職員">'+data.staff.filter(function(s){return s.status==='active';}).map(function(s){var v='staff:'+s.id;return '<option value="'+v+'"'+(sel===v?' selected':'')+'>'+esc(s.name)+'（'+esc(s.title)+'）</option>';}).join('')+'</optgroup>';
  o+='<optgroup label="部署（部署のだれか）">'+data.departments.map(function(d){var v='dept:'+d.id;return '<option value="'+v+'"'+(sel===v?' selected':'')+'>'+esc(d.name)+'</option>';}).join('')+'</optgroup>';
  return o;
}
function expectedApprover(t){
  if(t.approval)return t.approval.approverId;
  if(t.assignee&&t.assignee.type==='staff')return resolveApprover(t,t.assignee.id).approverId;
  return t.approverId||data.settings.defaultApproverId;
}
function reviewTaskPanel(t,scope){
  var report=t.comments.filter(function(c){return c.kind==='completion_report';}).slice(-1)[0];
  return '<section class="card stack" aria-labelledby="h-review"><h2 id="h-review" style="font-size:18px">承認する</h2>'+
    '<p>'+esc(staffName(t.approval.requestedById))+'さんが完了を報告しました（'+esc(fmtStamp(t.approval.requestedAt))+'）</p>'+
    (report?'<p class="notice notice-plain">「'+esc(report.text)+'」</p>':'')+
    (t.gov&&t.gov.copyFile?'<p>控え：'+esc(t.gov.copyFile)+'</p>':'')+
    (t.approval.isSelf?'<p class="notice notice-warn">ほかに承認できる人がいないため、自己承認として記録されます</p>':'')+
    '<div class="row"><button type="button" class="btn btn-primary" data-action="approve-task" data-id="'+t.id+'">承認する</button></div>'+
    '<form data-form="return-task" data-id="'+t.id+'" class="stack" novalidate><div class="field"><label class="lbl" for="rt-'+t.id+'">差し戻す理由 <span class="req">※差し戻す場合は必須</span></label><span class="hint">担当者の画面にそのまま表示されます</span><textarea id="rt-'+t.id+'" name="reason" rows="2"'+(ui.formErr&&ui.formErr['rt-'+t.id]?' class="input-error"':'')+'></textarea>'+fieldErr('rt-'+t.id)+'</div><div><button type="submit" class="btn">差し戻す</button></div></form>'+(scope==='approvals'?approvalNextButton(me(),t.id):'')+'</section>';
}

/* ---------------- 画面：業務・依頼の作成 ---------------- */
function viewTaskForm(u){
  var kind=formVal('kind','task');
  var errs=ui.formErr?Object.keys(ui.formErr).length:0;
  return '<p class="no-print"><a href="#/tasks">'+I.back+'戻る</a></p>'+pageTitle('業務・依頼を作成')+
  (errs?'<div class="notice notice-warn" role="alert">'+I.alert+'<span>入力内容を確認してください（'+errs+'か所）</span></div>':'')+
  '<form data-form="new-task" class="card stack" novalidate style="max-width:720px">'+
    '<fieldset><legend>種類 <span class="req">※必須</span></legend>'+

  var r=reqById(id);
  if(!r||!canManageRequest(u,r))return notFound();
  var all=targetsOf(r);
  var counted=all.filter(function(x){return x.status!=='excluded';});
  var approved=all.filter(function(x){return x.status==='approved';}).length;
  var submitted=all.filter(function(x){return x.status==='submitted';}).length;
  var f=ui.filter['req-'+r.id]||'all';
  var defs=[['all','すべて',function(){return true;}],['not_submitted','未提出',function(x){return x.status==='not_submitted';}],['returned','差し戻し',function(x){return x.status==='returned';}],['submitted','確認待ち',function(x){return x.status==='submitted';}],['approved','承認済み',function(x){return x.status==='approved';}],['excluded','対象外',function(x){return x.status==='excluded';}]];
  var cur=defs.filter(function(d){return d[0]===f;})[0]||defs[0];
  var rows=all.filter(cur[2]);
  var sel=(ui.selected[r.id]||[]).filter(function(tid){var x=byId(data.targets,tid);return x&&x.status==='submitted';});
  ui.selected[r.id]=sel;
  var esc2=escalationCandidates(r);
  var isReviewer=r.reviewerId===u.id;
  var panelHtml='';
  if(ui.panel&&ui.panel.requestId===r.id){panelHtml=targetPanel(u,byId(data.targets,ui.panel.targetId),ui.panel.mode);}
  if(!panelHtml)panelHtml='<section class="card stack"><h2 style="font-size:18px">提出物の確認</h2><p class="text-2">一覧の「確認する」を選ぶと、ここに内容が表示されます。</p></section>';
  return '<p class="no-print"><a href="#/requests">'+I.back+'提出の一覧へ</a></p>'+
  '<div class="split"><div class="main-col">'+
    '<div class="row-between"><div class="stack-sm">'+pageTitle('提出状況：'+r.title)+'<p class="text-2">期限 '+esc(fmtDate(r.dueOn))+(r.dueTime?' '+esc(r.dueTime):'')+'　依頼 '+esc(staffName(r.requesterId))+'　確認 '+esc(staffName(r.reviewerId))+'　区分 '+esc(DATA_CLASS[r.dataClass].label)+'</p></div>'+
    '<div class="row no-print"><button type="button" id="btn-remind" class="btn" data-action="remind" data-id="'+r.id+'">催促を送る</button><a class="btn" href="#/requests/'+r.id+'/print">未提出者一覧を印刷</a></div></div>'+
    '<div class="card stack-sm"><p style="font-size:18px"><strong style="font-size:24px">'+counted.length+'名中 '+(approved+submitted)+'名</strong> が提出（承認済み '+approved+'名・確認待ち '+submitted+'名）</p>'+
      (r.fileMode==='no_file'?'<p class="text-2">この依頼はファイルを受け取らず、回答と'+esc(qOf(r).date)+'だけを記録します。</p>':'')+'</div>'+
    (esc2.length?'<p class="notice notice-warn">'+I.alert+'<span>督促しても未提出の人、通知が届かない人が'+esc2.length+'名います（'+esc2.map(function(x){return staffName(x.staffId);}).join('、')+'）。直接声をかけてください。</span></p>':'')+
    '<div class="chips" role="group" aria-label="状態で絞り込む">'+defs.map(function(d){return '<button type="button" class="chip" data-action="filter" data-scope="req-'+r.id+'" data-value="'+d[0]+'" aria-pressed="'+(d[0]===cur[0])+'">'+esc(d[1])+' '+all.filter(d[2]).length+'</button>';}).join('')+'</div>'+
    '<div class="table-wrap"><table><thead><tr><th scope="col"><span class="sr-only">選ぶ</span></th><th scope="col">職員</th><th scope="col">状態</th><th scope="col">提出</th><th scope="col">操作</th></tr></thead><tbody>'+
      (rows.length?rows.map(function(x){
        var s=staff(x.staffId);var last=lastSubmission(x);
        var isCur=ui.panel&&ui.panel.targetId===x.id;
        var ops=[];
        if(x.status==='submitted'||x.status==='approved'||x.status==='returned')ops.push('<button type="button" class="btn-text" data-action="open-panel" data-mode="review" data-req="'+r.id+'" data-id="'+x.id+'">確認する</button>');
        if(x.status==='not_submitted'||x.status==='returned')ops.push('<button type="button" class="btn-text" data-action="open-panel" data-mode="proxy" data-req="'+r.id+'" data-id="'+x.id+'">代理で登録</button>');
        if(x.status==='not_submitted')ops.push('<button type="button" class="btn-text" data-action="open-panel" data-mode="exclude" data-req="'+r.id+'" data-id="'+x.id+'">対象外にする</button>');
        return '<tr'+(isCur?' class="is-current"':'')+'><td>'+(x.status==='submitted'&&isReviewer?'<input type="checkbox" id="sel-'+x.id+'" data-select="'+r.id+'" value="'+x.id+'"'+(sel.indexOf(x.id)>=0?' checked':'')+' aria-label="'+esc(s.name)+'さんを選ぶ">':'')+'</td>'+
          '<td>'+esc(s.name)+'<br><span class="text-2">'+esc(deptName(x.departmentId))+'</span></td>'+
          '<td>'+targetTag(x)+(x.hasLogin?'':'<br><span class="text-2">アカウントなし</span>')+(last&&last.proxy?'<br><span class="text-2">代理登録</span>':'')+'</td>'+
          '<td>'+(last?esc(fmtStamp(last.at)):'')+'</td>'+
          '<td>'+(ops.length?ops.join('<br>'):'-')+'</td></tr>';
      }).join(''):'<tr><td colspan="5">この条件に合う人はいません（0名）</td></tr>')+
    '</tbody></table></div>'+
    (!submitted?'':isReviewer?'<div class="row"><span>'+sel.length+'名を選んでいます</span><button type="button" id="btn-bulk" class="btn'+(sel.length&&!(ui.panel&&ui.panel.requestId===r.id)?' btn-primary':'')+'" data-action="bulk-approve" data-id="'+r.id+'"'+(sel.length?'':' aria-describedby="bulk-hint"')+'>選んだ'+sel.length+'名を承認する</button><span class="text-2" id="bulk-hint">'+(sel.length?'まとめて承認するときだけ、件数の確認が出ます':'確認待ちの人を選ぶと、まとめて承認できます')+'</span></div>':'<p class="text-2">承認できるのは確認する人（'+esc(staffName(r.reviewerId))+'さん）です。</p>')+
  '</div><div class="side-col">'+panelHtml+'</div></div>';
}
function lastSubmission(x){var subs=data.submissions.filter(function(s){return s.targetId===x.id;});return subs.length?subs[subs.length-1]:null;}
function submissionContent(x){
  var r=reqOf(x);var s=lastSubmission(x);
  if(!s)return '<p class="text-2">まだ提出はありません</p>';
  var body='';
  if(r.fileMode==='no_file'){var a=s.answer||{};var q=qOf(r);body='<dl class="dl"><dt>回答</dt><dd>'+esc(a.examined==='yes'?q.yes:q.no)+'</dd>'+(a.date?'<dt>'+esc(q.date)+'</dt><dd>'+esc(fmtDate(a.date))+'</dd>':'')+'</dl>';}
  else body='<div class="thumb" role="img" aria-label="提出されたファイル（見本の表示）">'+I.doc+'<span>'+esc(s.fileName||'ファイル')+'</span></div>';
  return '<p class="text-2">'+esc(fmtStamp(s.at))+'　'+s.version+'回目の提出'+(s.proxy?'（代理登録：'+esc(staffName(s.byId))+'）':'')+'</p>'+body+(s.comment?'<div><p class="text-2">本人のコメント</p><p>'+esc(s.comment)+'</p></div>':'')+(s.proxyReason?'<p class="text-2">代理登録の理由：'+esc(s.proxyReason)+'</p>':'');
}
function targetPanel(u,x,mode,scope){
  if(!x)return '';
  var r=reqOf(x);var s=staff(x.staffId);
  if(mode==='proxy'){
    return '<section class="card stack" aria-labelledby="h-panel"><h2 id="h-panel" style="font-size:18px">'+esc(s.name)+'さんの代理登録</h2><p>紙で受け取った場合などに、本人に代わって「提出した」ことを記録します。記録には代理で登録した人の名前が残ります。</p>'+
      '<form data-form="proxy" data-id="'+x.id+'" class="stack" novalidate><div class="field"><label class="lbl" for="px">理由 <span class="req">※必須</span></label><input id="px" name="reason" type="text" value="紙で受け取ったため"'+(ui.formErr&&ui.formErr.px?' class="input-error"':'')+'>'+fieldErr('px')+'</div><div class="row-between"><button type="button" class="btn-text" data-action="close-panel">キャンセル</button><button type="submit" class="btn btn-primary">代理で登録する</button></div></form></section>';
  }
  if(mode==='exclude'){
    return '<section class="card stack" aria-labelledby="h-panel"><h2 id="h-panel" style="font-size:18px">'+esc(s.name)+'さんを対象外にする</h2>'+
      '<form data-form="exclude" data-id="'+x.id+'" class="stack" novalidate><div class="field"><label class="lbl" for="ex">理由 <span class="req">※必須</span></label><input id="ex" name="reason" type="text"'+(ui.formErr&&ui.formErr.ex?' class="input-error"':'')+'>'+fieldErr('ex')+'</div><div class="row-between"><button type="button" class="btn-text" data-action="close-panel">キャンセル</button><button type="submit" class="btn btn-primary">対象外にする</button></div></form></section>';
  }
  var canDecide=x.status==='submitted'&&r.reviewerId===u.id;
  var next='';
  if(scope==='approvals'){next=approvalNextButton(u,x.id);}
  else if(r.reviewerId===u.id){var others=targetsOf(r).filter(function(y){return y.status==='submitted'&&y.id!==x.id;});if(others.length)next='<button type="button" class="btn-text" style="align-self:flex-start;text-align:left" data-action="open-panel" data-mode="review" data-req="'+r.id+'" data-id="'+others[0].id+'">次の人（'+esc(staffName(others[0].staffId))+'さん）へ</button>';}
  return '<section class="card stack" aria-labelledby="h-panel"><h2 id="h-panel" style="font-size:18px">'+esc(s.name)+'さんの提出</h2>'+submissionContent(x)+
    (x.status==='returned'?'<p class="quote">差し戻しの理由：「'+esc(x.returnReason)+'」</p>':'')+
    (canDecide?'<div class="row"><button type="button" class="btn btn-primary" data-action="approve-target" data-id="'+x.id+'">承認する</button></div>'+
      '<form data-form="return-target" data-id="'+x.id+'" class="stack" novalidate><div class="field"><label class="lbl" for="rx-'+x.id+'">差し戻す理由 <span class="req">※差し戻す場合は必須</span></label><span class="hint">本人の画面にそのまま表示されます</span><textarea id="rx-'+x.id+'" name="reason" rows="2"'+(ui.formErr&&ui.formErr['rx-'+x.id]?' class="input-error"':'')+'></textarea>'+fieldErr('rx-'+x.id)+'</div><div><button type="submit" class="btn">差し戻す</button></div></form>':
      (x.status==='submitted'?'<p class="text-2">承認できるのは確認する人（'+esc(staffName(r.reviewerId))+'さん）です。</p>':''))+
    next+'</section>';
}
function viewPrint(u,id){

  '</tbody></table></div><p class="no-print"><button type="button" class="btn btn-primary" data-action="print">印刷する</button></p>';

/* ---------------- 画面：承認待ち ---------------- */
function approvalItems(u){
  var a=myApprovals(u);
  var items=a.tasks.map(function(t){return {kind:'task',id:t.id,title:t.title,who:staffName(t.approval.requestedById),at:t.approval.requestedAt,label:'業務'};})
    .concat(a.targets.map(function(x){var s=lastSubmission(x);return {kind:'target',id:x.id,title:reqOf(x).title,who:staffName(x.staffId),at:s?s.at:'',label:'提出物'};}));
  items.sort(function(p,q){return p.at<q.at?-1:p.at>q.at?1:0;});
  return items;
}
function approvalIndex(u,id){return approvalItems(u).map(function(it){return it.id;}).indexOf(id);}
function approvalPanelAt(u,idx){var its=approvalItems(u);if(!its.length)return null;var it=its[Math.min(Math.max(idx,0),its.length-1)];return {scope:'approvals',kind:it.kind,id:it.id};}
function approvalNextButton(u,id){
  var its=approvalItems(u);var i=its.map(function(it){return it.id;}).indexOf(id);var nx=i>=0?its[i+1]:null;
  if(!nx)return '';
  return '<button type="button" class="btn-text" style="align-self:flex-start;text-align:left" data-action="open-panel" data-scope="approvals" data-kind="'+nx.kind+'" data-id="'+nx.id+'">次の件へ（'+esc(nx.who)+'さん・'+esc(nx.title)+'）</button>';
}
function otherApprovals(u){
  var list=[];
  data.tasks.forEach(function(t){if(t.status==='awaiting_approval'&&t.approval&&t.approval.status==='pending'&&t.approval.approverId!==u.id&&taskVisible(u,t))list.push({label:'業務',title:t.title,who:staffName(t.approval.requestedById),at:t.approval.requestedAt,approver:staffName(t.approval.approverId),link:'#/tasks/'+t.id});});

function viewStaffHome(u){
  var T=today();

  var myTasks=data.tasks.filter(function(t){return isOpenTask(t)&&isAssignee(u,t)&&!t.isChecklist;});
  var myTargets=data.targets.filter(function(x){return x.staffId===u.id&&reqOf(x).status==='open';});
  var shown={};
  function mark(id){shown[id]=1;}
  var returned=[];
  myTargets.filter(function(x){return x.status==='returned';}).forEach(function(x){returned.push(targetCard(x,true,cardNo++===0));mark(x.id);});
  myTasks.filter(function(t){return t.status==='returned';}).forEach(function(t){returned.push(taskCard(t,true,cardNo++===0));mark(t.id);});
  var overdue=[];
  myTasks.filter(function(t){return !shown[t.id]&&t.dueOn<T&&t.status!=='awaiting_approval';}).forEach(function(t){overdue.push(taskCard(t,false,cardNo++===0));mark(t.id);});
  myTargets.filter(function(x){return !shown[x.id]&&x.status==='not_submitted'&&reqOf(x).dueOn<T;}).forEach(function(x){overdue.push(targetCard(x,false,cardNo++===0));mark(x.id);});
  var todays=[];
  myTargets.filter(function(x){return !shown[x.id]&&x.status==='not_submitted'&&reqOf(x).dueOn===T;}).forEach(function(x){todays.push(targetCard(x,false,cardNo++===0));mark(x.id);});
  myTasks.filter(function(t){return !shown[t.id]&&t.dueOn===T&&t.status!=='awaiting_approval';}).forEach(function(t){todays.push(taskCard(t,false,cardNo++===0));mark(t.id);});
  var news=[];
  myTargets.filter(function(x){return !shown[x.id]&&x.status==='not_submitted'&&!x.seenAt;}).forEach(function(x){news.push(targetCard(x,false,cardNo++===0));mark(x.id);});
  myTasks.filter(function(t){return !shown[t.id]&&t.kind==='request'&&!t.acknowledgedAt;}).forEach(function(t){news.push(taskCard(t,false,cardNo++===0));mark(t.id);});
  var cl=data.tasks.filter(function(t){return t.isChecklist&&t.dueOn===T&&t.assignee&&t.assignee.type==='dept'&&t.assignee.id===u.deptId&&!t.cancelledAt;});

    var d=addDays(weekStart,i);var dt=parseDate(d);
    var n=myTasks.filter(function(t){return t.dueOn===d;}).length+myTargets.filter(function(x){return (x.status==='not_submitted'||x.status==='returned')&&reqOf(x).dueOn===d;}).length;

    days+='<div class="day'+(isT?' today':'')+'" aria-label="'+(dt.getMonth()+1)+'月'+dt.getDate()+'日 '+WEEK[dt.getDay()]+'曜'+(isT?' 今日':'')+' 予定'+n+'件"><span aria-hidden="true">'+WEEK[dt.getDay()]+'</span><span aria-hidden="true">'+dt.getDate()+'</span>'+(n?'<span class="dot" aria-hidden="true"></span>':'')+'</div>';
  }
  function section(id,title,items,warn){if(!items.length)return '';return '<section aria-labelledby="'+id+'" class="stack"><h2 id="'+id+'" class="section-title" style="font-size:18px'+(warn?';color:'+warn:'')+'">'+(warn?I.alert:'')+esc(title)+'（'+items.length+'件）</h2>'+items.slice(0,5).join('')+(items.length>5?'<p class="text-2">ほかに'+(items.length-5)+'件あります。「業務」「提出」のタブで見られます</p>':'')+'</section>';}
  return pageTitle('今日のやること（'+count+'件）')+
    section('h-ret','差し戻し',returned,'var(--warn)')+
    section('h-over','期限を過ぎています',overdue,'var(--danger)')+
    section('h-today','今日まで',todays)+
    section('h-new','新しい依頼',news)+
    (cl.length?'<section aria-labelledby="h-cl" class="stack"><h2 id="h-cl" style="font-size:18px">今日のチェックリスト（'+esc(deptName(u.deptId))+'）</h2><ul class="checklist">'+cl.map(function(t){
      return '<li><span>'+esc(t.title)+'</span>'+(t.status==='completed'?'<span class="tag-plain">'+I.check+'完了 '+esc((t.completedAt||'').split('T')[1]||'')+'</span>':'<button type="button" class="btn btn-sm" data-action="check-done" data-id="'+t.id+'" aria-label="'+esc(t.title)+'を完了にする">完了</button>')+'</li>';}).join('')+'</ul></section>':'')+
    (count===0?'<p class="card">今日やることはありません。おつかれさまです。</p>':'')+
    '<section aria-labelledby="h-week" class="stack"><h2 id="h-week" style="font-size:18px">今週の予定</h2><div class="week">'+days+'</div><a href="#/tasks">これからの業務をすべて見る</a></section>';
}
