function viewSubmitFlow(u,targetId){
  var x=byId(data.targets,targetId);
  if(!x||x.staffId!==u.id)return notFound();
  if(!x.seenAt){x.seenAt=nowStamp();save();}
  var r=reqOf(x);
  if(r.status!=='open'||!(x.status==='not_submitted'||x.status==='returned')){
    var fl=ui.flow[x.id];
    if(!(fl&&fl.step===4))return pageTitle(r.title)+'<p class="card">この提出は受け付け済みです（'+targetTag(x)+'）。<a href="#/">今日のやることに戻る</a></p>';
  }
  var f=ui.flow[x.id]||(ui.flow[x.id]={step:1});
  var q=qOf(r);
  var back=(f.step===2||f.step===3||f.step==='later')?'<button type="button" class="btn-text" data-action="flow-back" data-id="'+x.id+'" style="align-self:flex-start;text-decoration:none">'+I.back+'戻る</button>':(f.step===1?'<a href="#/" style="align-self:flex-start;min-height:44px;display:inline-flex;align-items:center">'+I.back+'戻る</a>':'');
  var body='';
  if(f.step===1){
    body=pageTitle(r.title+'を提出する')+
      (x.status==='returned'&&x.returnReason?'<p class="quote">差し戻しの理由：「'+esc(x.returnReason)+'」</p>':'')+
      '<dl class="dl"><dt>期限</dt><dd>'+dueBadge(r.dueOn,true)+' '+esc(fmtDate(r.dueOn))+(r.dueTime?' '+esc(r.dueTime)+'まで':'')+'</dd><dt>依頼した人</dt><dd>'+esc(staffName(r.requesterId))+'</dd><dt>出すもの</dt><dd>'+(r.fileMode==='no_file'?esc(q.what):'書類（写真でもファイルでも出せます）')+'</dd></dl>'+
      (r.instructions?'<p class="notice notice-plain">'+esc(r.instructions)+'</p>':'')+
      '<div class="bottom"><button type="button" class="btn btn-primary btn-lg" data-action="flow-next" data-id="'+x.id+'">次へ</button></div>';
  }else if(f.step===2){
    if(r.fileMode==='no_file'){
      var ans=f.answer||{};
      body=pageTitle(q.text)+
        '<form data-form="flow-answer" data-id="'+x.id+'" class="stack" novalidate style="flex:1">'+
        '<fieldset><legend class="sr-only">'+esc(q.text)+'</legend>'+
        '<label class="radio"><input type="radio" name="examined" value="yes"'+(ans.examined==='yes'?' checked':'')+'><span>'+esc(q.yes)+'</span></label>'+
        '<label class="radio"><input type="radio" name="examined" value="no"'+(ans.examined==='no'?' checked':'')+'><span>'+esc(q.no)+'</span></label>'+fieldErr('examined')+'</fieldset>'+
        '<div class="field"><label class="lbl" for="ex-date">'+esc(q.date)+' <span class="req">※「'+esc(q.yes)+'」の場合は必須</span></label><input id="ex-date" name="date" type="date" max="'+today()+'" value="'+esc(ans.date||'')+'"'+(ui.formErr&&ui.formErr.date?' class="input-error"':'')+'>'+fieldErr('date')+'</div>'+
        '<p class="hint">結果などの書類は、この画面では受け取りません。</p>'+
        '<div class="bottom"><button type="submit" class="btn btn-primary btn-lg">次へ</button></div></form>';
    }else{
      body=pageTitle('書類の写真を撮ってください')+
        '<p class="text-2">紙の全体が写るように撮ってください。ファイルがある場合は選ぶこともできます。</p>'+fieldErr('file')+
        '<div class="bottom">'+
        '<label class="btn btn-primary btn-lg file-btn">'+I.camera+'写真を撮る<input type="file" accept="image/*" capture="environment" data-flow="'+x.id+'"></label>'+
        '<label class="btn btn-lg file-btn">ファイルを選ぶ<input type="file" accept="image/*,application/pdf" data-flow="'+x.id+'"></label></div>';
    }
  }else if(f.step===3){
    var summary=r.fileMode==='no_file'?
      '<dl class="dl"><dt>回答</dt><dd>'+esc(q.yes)+'</dd><dt>'+esc(q.date)+'</dt><dd>'+esc(fmtDate(f.answer.date))+'</dd></dl>':
      '<div class="thumb" role="img" aria-label="選んだファイル">'+I.doc+'<span>'+esc(f.fileName)+'</span></div><div class="row-between"><span class="text-2">1件</span><button type="button" class="btn-text" data-action="flow-back" data-id="'+x.id+'">撮り直す</button></div>';
    body=pageTitle('この内容で提出しますか')+summary+
      '<form data-form="flow-send" data-id="'+x.id+'" class="stack" novalidate style="flex:1"><div class="field"><label class="lbl" for="memo">コメント <span class="req">※任意</span></label><textarea id="memo" name="comment" rows="3">'+esc(f.comment||'')+'</textarea></div>'+
      '<div class="bottom"><button type="submit" class="btn btn-primary btn-lg">提出する</button></div></form>';
  }else if(f.step==='later'){
    body=pageTitle(q.laterTitle)+'<p>'+esc(q.later)+'</p><dl class="dl"><dt>期限</dt><dd>'+esc(fmtDate(r.dueOn))+'</dd><dt>わからないとき</dt><dd>'+esc(staffName(r.requesterId))+'さんに相談してください</dd></dl>'+
      '<div class="bottom"><a class="btn btn-primary btn-lg" href="#/" data-action="flow-finish" data-id="'+x.id+'">今日のやることに戻る</a></div>';
  }else{
    var left=staffTodoCount(u);
    body='<div class="stack" style="align-items:center;text-align:center;margin-top:48px"><span class="done-mark">'+I.bigcheck+'</span>'+pageTitle('提出しました')+'<p>'+esc(staffName(r.reviewerId))+'さんが確認します。<br>結果は「通知」でお知らせします。</p></div>'+
      '<p class="notice notice-plain" style="justify-content:center">今日のやることは、あと'+left+'件です</p>'+
      '<div class="bottom"><a class="btn btn-primary btn-lg" href="#/" data-action="flow-finish" data-id="'+x.id+'">今日のやることに戻る</a></div>';
  }
  return '<div class="flow">'+back+body+'</div>';
}
function staffTodoCount(u){
  var T=today();
  var t1=data.tasks.filter(function(t){return isOpenTask(t)&&isAssignee(u,t)&&!t.isChecklist&&t.status!=='awaiting_approval'&&(t.dueOn<=T||t.status==='returned'||(t.kind==='request'&&!t.acknowledgedAt));}).length;
  var t2=data.targets.filter(function(x){var r=reqOf(x);return x.staffId===u.id&&r.status==='open'&&(x.status==='returned'||(x.status==='not_submitted'&&(r.dueOn<=T||!x.seenAt)));}).length;
  var t3=data.tasks.filter(function(t){return t.isChecklist&&t.dueOn===T&&t.status!=='completed'&&t.assignee&&t.assignee.type==='dept'&&t.assignee.id===u.deptId;}).length;
  return t1+t2+t3;
}

/* ---------------- 操作（データの変更） ---------------- */
function hist(t,from,to,action,reason){t.history.push({at:nowStamp(),byId:data.currentUserId,from:from,to:to,action:action,reason:reason||''});}
function resolveApprover(t,completerId){
  var a=t.approverId||data.settings.defaultApproverId;var isSelf=false;
  if(a===completerId){a=data.settings.fallbackApproverId;if(a===completerId)isSelf=true;}
  return {approverId:a,isSelf:isSelf};
}
function reportCompletion(t,comment,copyName){
  var u=me();
  if(!canWork(u,t))return {copy:'この業務は完了を報告できません'};
  var isGov=t.category==='行政提出';
  if(isGov&&!copyName&&!(t.gov&&t.gov.copyFile))return {copy:'提出した書類の控えを選んでください。運営指導で「提出した証拠」として使います'};
  if(copyName){t.gov=t.gov||{};t.gov.copyFile=copyName;}
  if(comment)t.comments.push({at:nowStamp(),byId:u.id,kind:'completion_report',text:comment});
  var from=t.status;
  if(t.requiresApproval){
    var res=resolveApprover(t,u.id);
    t.status='awaiting_approval';t.returnReason='';
    t.approval={approverId:res.approverId,status:'pending',requestedAt:nowStamp(),isSelf:res.isSelf,requestedById:u.id,actions:(t.approval&&t.approval.actions)||[]};
    hist(t,from,'awaiting_approval','完了を報告（'+staffName(res.approverId)+'さんの承認待ち）');
    if(!res.isSelf)notify(res.approverId,'承認の依頼：'+t.title,u.name+'さんが完了を報告しました','#/approvals',true);
    toast('完了を報告しました。'+staffName(res.approverId)+'さんが確認します。');
  }else{
    t.status='completed';t.completedAt=nowStamp();t.completedById=u.id;
    hist(t,from,'completed','完了を報告');
    if(t.requestedById&&t.requestedById!==u.id)notify(t.requestedById,'完了しました：'+t.title,u.name+'さんが完了を報告しました','#/tasks/'+t.id,false);
    toast('完了を報告しました。');
  }
  log('完了報告',t.title);
  return null;
}
function approveTask(t){
  var u=me();
  if(!(t.status==='awaiting_approval'&&t.approval&&t.approval.approverId===u.id&&isManager(u))){toast('この業務を承認できるのは、指定された承認者です','error');return;}
  t.status='completed';t.completedAt=nowStamp();t.completedById=t.approval.requestedById;
  t.approval.status='approved';t.approval.actions.push({at:nowStamp(),byId:u.id,action:'承認'});
  hist(t,'awaiting_approval','completed',t.approval.isSelf?'承認（自己承認）':'承認');
  notify(t.approval.requestedById,'承認されました：'+t.title,u.name+'さんが承認しました','#/tasks/'+t.id,false);
  log('承認',t.title);
  toast('承認しました：'+t.title);
}
function returnTask(t,reason){
  var u=me();
  if(!(t.status==='awaiting_approval'&&t.approval&&t.approval.approverId===u.id)){toast('この業務を差し戻せるのは、指定された承認者です','error');return;}
  t.status='returned';t.returnReason=reason;
  t.approval.status='returned';t.approval.actions.push({at:nowStamp(),byId:u.id,action:'差し戻し',reason:reason});
  hist(t,'awaiting_approval','returned','差し戻し',reason);
  notify(t.approval.requestedById,'差し戻し：'+t.title,reason,'#/tasks/'+t.id,true);
  log('差し戻し',t.title);
  toast('差し戻しました：'+t.title);
}
function doSubmit(x,payload){
  var u=me();var r=reqOf(x);
  var version=data.submissions.filter(function(s){return s.targetId===x.id;}).length+1;
  data.submissions.push({id:nid('sub'),targetId:x.id,version:version,at:nowStamp(),byId:u.id,proxy:false,fileName:payload.fileName||'',fileSize:payload.fileSize||0,answer:payload.answer||null,comment:payload.comment||''});
  x.status='submitted';x.returnReason='';
  notify(r.reviewerId,'確認の依頼：'+r.title,u.name+'さんが提出しました','#/approvals',true);
  log('提出',r.title+'（'+u.name+'）');
}
function approveTargets(ids){
  var u=me();var n=0;
  ids.forEach(function(id){
    var x=byId(data.targets,id);if(!x||x.status!=='submitted')return;
    var r=reqOf(x);if(r.reviewerId!==u.id)return;
    x.status='approved';x.actions.push({at:nowStamp(),byId:u.id,action:'承認'});
    notify(x.staffId,'承認されました：'+r.title,u.name+'さんが確認しました','#/requests',false);
    log('承認',r.title+'（'+staffName(x.staffId)+'）');n++;
  });
  return n;
}
function returnTarget(x,reason){
  var u=me();var r=reqOf(x);
  if(!(x.status==='submitted'&&r.reviewerId===u.id)){toast('差し戻せるのは確認する人です','error');return;}
  x.status='returned';x.returnReason=reason;x.actions.push({at:nowStamp(),byId:u.id,action:'差し戻し',reason:reason});
  notify(x.staffId,'差し戻し：'+r.title,reason,'#/submit/'+x.id,true);
  log('差し戻し',r.title+'（'+staffName(x.staffId)+'）');
  toast(staffName(x.staffId)+'さんの提出を差し戻しました');
}
function remind(r){
  var sent=0,noLogin=0;
  targetsOf(r).forEach(function(x){
    if(!(x.status==='not_submitted'||x.status==='returned'))return;
    if(!x.hasLogin){noLogin++;return;}
    if(notify(x.staffId,'提出のお願い：'+r.title,'期限は'+fmtDate(r.dueOn)+'です','#/submit/'+x.id,true)){x.reminders=(x.reminders||0)+1;sent++;}
  });
  r.rounds=(r.rounds||0)+1;
  log('催促を送信',r.title+'（'+sent+'名）');
  checkEscalation(r);
  toast(sent+'名に催促を送りました。'+(noLogin?'アカウントのない'+noLogin+'名には届きません（未提出者一覧を印刷して渡してください）。':''));
}
function createTask(v){
  var errs={};
  if(!v.title.trim())errs.title='業務名を入力してください';
  if(!v.dueOn)errs.dueOn='期限を入力してください';else if(v.dueOn<today())errs.dueOn='今日以降の日付を選んでください';
  if(v.kind==='request'&&!v.assignee)errs.assignee='依頼する相手を選んでください';
  if(Object.keys(errs).length)return errs;
  var u=me();var asg=null;
  if(v.assignee){var p=v.assignee.split(':');asg={type:p[0],id:p[1]};}
  var t=mkTask({title:v.title.trim(),category:v.category,kind:v.kind,assignee:asg,dueOn:v.dueOn,description:v.description.trim(),requiresApproval:v.requiresApproval||v.category==='行政提出',requestedById:v.kind==='request'?u.id:null,departmentId:asg?null:u.deptId});
  if(t.category==='行政提出')t.gov={destination:'',method:'',receiptNumber:'',copyFile:''};
  hist(t,null,'not_started','作成');
  data.tasks.push(t);
  if(asg){
    var targets=asg.type==='staff'?[asg.id]:data.staff.filter(function(s){return s.deptId===asg.id;}).map(function(s){return s.id;});
    targets.forEach(function(sid){if(sid!==u.id)notify(sid,(v.kind==='request'?'依頼：':'業務：')+t.title,u.name+'さんから','#/tasks/'+t.id,v.kind==='request');});
  }
  log(v.kind==='request'?'依頼を作成':'業務を作成',t.title);
  toast((v.kind==='request'?'依頼を送りました：':'業務を作成しました：')+t.title);
  return {_id:t.id};
}
function createRequest(v){
  var errs={};
  if(!v.title.trim())errs.title='提出依頼の名前を入力してください';
  if(!v.dueOn)errs.dueOn='期限を入力してください';else if(v.dueOn<today())errs.dueOn='今日以降の日付を選んでください';
  if(!v.dataClass)errs.dataClass='書類の区分を選んでください';
  if(Object.keys(errs).length)return errs;
  var u=me();
  var r={id:nid('r'),title:v.title.trim(),instructions:v.instructions.trim(),dueOn:v.dueOn,dueTime:'',dataClass:v.dataClass,fileMode:v.dataClass==='c4'?'no_file':'file_required',target:v.target==='all'?{type:'all'}:{type:'depts',ids:[v.target]},reviewerId:v.reviewerId,requesterId:u.id,reminder:v.reminder,rounds:0,escalatedOn:null,status:'open',createdAt:nowStamp()};
  data.requests.push(r);
  var people=data.staff.filter(function(s){return s.status!=='left'&&(v.target==='all'||s.deptId===v.target);});
  var sent=0;
  people.forEach(function(s){
    var excluded=s.status==='on_leave';
    data.targets.push({id:nid('x'),requestId:r.id,staffId:s.id,departmentId:s.deptId,hasLogin:s.hasLogin,status:excluded?'excluded':'not_submitted',reminders:0,sentKeys:[],returnReason:'',excludedReason:excluded?'休職中':'',actions:[],seenAt:null});
    if(!excluded&&notify(s.id,'提出の依頼：'+r.title,'期限は'+fmtDate(r.dueOn)+'です','#/submit/'+data.targets[data.targets.length-1].id,false))sent++;
  });
  log('提出依頼を作成',r.title+'（対象 '+people.length+'名）');
  toast('提出依頼を送りました（'+sent+'名にお知らせ）');
  return {_id:r.id};
}

/* ---------------- 操作の受け付け ---------------- */
function openDialog(d){ui.dialog=d;render();}
function dialogHtml(){
  var d=ui.dialog;if(!d)return '';
  return '<div class="backdrop"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title" aria-describedby="dlg-body"><h2 id="dlg-title">'+esc(d.title)+'</h2><p id="dlg-body">'+esc(d.body)+'</p><div class="dialog-actions"><button type="button" class="btn-text" data-action="dialog-cancel">キャンセル</button><button type="button" class="btn '+(d.danger?'btn-danger':'btn-primary')+'" data-action="dialog-ok" data-autofocus>'+esc(d.confirm)+'</button></div></div></div>';
}
function perform(kind,payload){
  if(kind==='bulk-approve'){var n=approveTargets(payload.ids);ui.selected[payload.scope]=[];ui.panel=null;toast(n+'件を承認しました');save();render();}
  else if(kind==='remind'){var r=reqById(payload.id);remind(r);save();render();}
  else if(kind==='reset-data'){seed();runDailyJobs();ui={toast:null,flow:{},filter:{},selected:{},panel:null,formErr:null,form:null,dialog:null,lastPath:null};toast('最初の状態に戻しました');save();go('/');}
}
function handleAction(a,el){
  var id=el.getAttribute('data-id');
  var u=me();
  switch(a){
    case 'advance-day':
      data.todayOffset=(data.todayOffset||0)+1;runDailyJobs();toast('日付を1日進めました（今日：'+fmtDate(today())+'）');render();break;
    case 'reset-day':
      data.todayOffset=0;runDailyJobs();toast('日付を今日に戻しました');render();break;
    case 'goto-filter':
      ui.filter.tasks=el.getAttribute('data-value');break; /* リンクの移動はそのまま */
    case 'filter':
      ui.filter[el.getAttribute('data-scope')]=el.getAttribute('data-value');ui.panel=null;render();break;
    case 'open-request':
      var tr=taskById(id);if(tr&&!tr.acknowledgedAt){tr.acknowledgedAt=nowStamp();hist(tr,tr.status,tr.status,'依頼を確認（既読）');log('依頼を確認',tr.title);save();}go('/tasks/'+id);break;
    case 'start-task':
      var ts=taskById(id);if(ts&&canWork(u,ts)&&ts.status==='not_started'){ts.status='in_progress';hist(ts,'not_started','in_progress','着手');log('着手',ts.title);save();toast('着手しました');}render();break;
    case 'check-done':
      var tc=taskById(id);if(tc&&tc.isChecklist&&isAssignee(u,tc)&&tc.status!=='completed'){tc.status='completed';tc.completedAt=nowStamp();tc.completedById=u.id;hist(tc,'not_started','completed','完了');log('チェックリストを完了',tc.title);save();toast(tc.title+'を完了にしました');}render();break;
    case 'approve-task':
      var ta=taskById(id);var inA=!!(ui.panel&&ui.panel.scope==='approvals');var ia=inA?approvalIndex(u,id):-1;if(ta){approveTask(ta);save();}ui.panel=inA?approvalPanelAt(u,ia):null;render();if(ui.panel)focusPanel();break;
    case 'approve-target':
      var xa=byId(data.targets,id);var inB=!!(ui.panel&&ui.panel.scope==='approvals');var ib=inB?approvalIndex(u,id):-1;
      var n=approveTargets([id]);if(n){toast(staffName(xa.staffId)+'さんの提出を承認しました');}else{toast('承認できるのは確認する人です','error');}
      save();
      if(inB){ui.panel=approvalPanelAt(u,ib);}
      else if(xa){var nx=targetsOf(reqOf(xa)).filter(function(y){return y.status==='submitted'&&reqOf(y).reviewerId===u.id;})[0];ui.panel=nx?{requestId:xa.requestId,targetId:nx.id,mode:'review'}:null;}
      else ui.panel=null;
      render();if(ui.panel)focusPanel();break;
    case 'bulk-approve':
      var scope=id;var ids=(ui.selected[scope]||[]).slice();
      if(!ids.length){toast('承認する提出物を選んでください','error');render();break;}
      openDialog({title:'まとめて承認します',body:ids.length+'件の提出物を承認します。承認すると、本人に「承認されました」と通知されます。',confirm:ids.length+'件を承認する',action:'bulk-approve',payload:{ids:ids,scope:scope},returnFocus:'btn-bulk'});break;
    case 'remind':
      var rr=reqById(id);var cnt=0,nl=0;targetsOf(rr).forEach(function(x){if(x.status==='not_submitted'||x.status==='returned'){if(x.hasLogin)cnt++;else nl++;}});
      if(!cnt){toast(nl?'通知が届く未提出の人はいません。アカウントのない'+nl+'名には、未提出者一覧を印刷して渡してください':'未提出の人はいません');render();break;}
      openDialog({title:'催促を送ります',body:'未提出・差し戻しの'+cnt+'名に送ります。すでに提出した人には届きません。'+(nl?'アカウントのない'+nl+'名には届かないため、未提出者一覧を印刷して渡してください。':''),confirm:'催促を送る',action:'remind',payload:{id:id},returnFocus:'btn-remind'});break;
    case 'open-panel':
      if(el.getAttribute('data-scope')==='approvals'){ui.panel={scope:'approvals',kind:el.getAttribute('data-kind'),id:id};}
      else ui.panel={requestId:el.getAttribute('data-req'),targetId:id,mode:el.getAttribute('data-mode')};
      ui.formErr=null;render();focusPanel();break;
    case 'close-panel':
      ui.panel=null;ui.formErr=null;render();break;
    case 'resume-task':
      var th=taskById(id);if(th&&th.status==='on_hold'&&canManageTask(u,th)){var back=th.statusBefore||'in_progress';th.status=back;th.holdReason='';hist(th,'on_hold',back,'保留を解除');log('保留を解除',th.title);save();toast('保留を解除しました');}render();break;
    case 'flow-next':
      var f1=ui.flow[id]||(ui.flow[id]={step:1});f1.step=2;ui.formErr=null;render();focusTitle();break;
    case 'flow-back':
      var f2=ui.flow[id];if(f2){f2.step=(f2.step==='later')?2:Math.max(1,f2.step-1);}ui.formErr=null;render();focusTitle();break;
    case 'flow-finish':
      delete ui.flow[id];break;
    case 'open-notif':
      var nn=byId(data.notifications,id);if(nn){if(!nn.readAt){nn.readAt=nowStamp();save();}var lk=nn.link.replace(/^#/,'');if(location.hash==='#'+lk){render();}else{location.hash=lk;}}break;
    case 'read-all':
      data.notifications.forEach(function(x){if(x.toId===u.id&&!x.readAt)x.readAt=nowStamp();});save();toast('すべて既読にしました');render();break;
    case 'reset-data':
      openDialog({title:'最初の状態に戻します',body:'操作した内容をすべて消して、最初の架空のデータに戻します。元には戻せません。',confirm:'最初の状態に戻す',danger:true,action:'reset-data',payload:{},returnFocus:'btn-reset'});break;
    case 'dialog-ok':
      var d=ui.dialog;ui.dialog=null;if(d){perform(d.action,d.payload);if(d.returnFocus&&!ui.dialog){var rf=document.getElementById(d.returnFocus);if(rf)rf.focus();}}else render();break;
    case 'dialog-cancel':
      closeDialog();break;
    case 'skip':
      var mn=document.getElementById('main');if(mn){mn.setAttribute('tabindex','-1');mn.focus();}break;
    case 'print':
      window.print();break;
  }
}
function focusTitle(){window.scrollTo(0,0);var h=document.getElementById('page-title');if(h)h.focus({preventScroll:true});}
function focusPanel(){var h=document.getElementById('h-panel')||document.getElementById('h-review');if(h){h.setAttribute('tabindex','-1');h.focus();}}
function closeDialog(){var d=ui.dialog;ui.dialog=null;render();if(d&&d.returnFocus){var rf=document.getElementById(d.returnFocus);if(rf)rf.focus();}}
function handleForm(name,form,fd){
  var id=form.getAttribute('data-id');
  var u=me();
  ui.formErr=null;
  function str(k){var v=fd.get(k);return v==null?'':String(v);}
  if(name==='complete-task'){
    var t=taskById(id);var file=fd.get('copy');var fname=(file&&file.name)?file.name:'';
    var err=reportCompletion(t,str('comment').trim(),fname);
    if(err){ui.formErr=err;render();var c=document.getElementById('copy');if(c)c.focus();return;}
    save();render();focusTitle();
  }else if(name==='return-task'){
    var tr=taskById(id);var reason=str('reason').trim();
    if(!reason){ui.formErr={};ui.formErr['rt-'+id]='差し戻す理由を入力してください。本人が直すときに使います';render();var e1=document.getElementById('rt-'+id);if(e1)e1.focus();return;}
    var inC=!!(ui.panel&&ui.panel.scope==='approvals');var ic=inC?approvalIndex(u,id):-1;
    returnTask(tr,reason);save();ui.panel=inC?approvalPanelAt(u,ic):null;render();if(ui.panel)focusPanel();
  }else if(name==='hold-task'){
    var th=taskById(id);var rs=str('reason').trim();
    if(!rs){ui.formErr={hold:'保留にする理由を入力してください'};render();var e2=document.getElementById('hold');if(e2)e2.focus();return;}
    if(th&&canManageTask(u,th)){var from=th.status;if(from==='awaiting_approval'&&th.approval){th.approval.status='cancelled';}th.statusBefore=(from==='awaiting_approval'?'in_progress':from);th.status='on_hold';th.holdReason=rs;hist(th,from,'on_hold','保留',rs);log('保留',th.title);save();toast('保留にしました');}
    render();
  }else if(name==='assign-task'){
    var ta=taskById(id);var v=str('assignee');
    if(!v){toast('担当を選んでください','error');render();return;}
    if(ta&&canManageTask(u,ta)){var p=v.split(':');ta.assignee={type:p[0],id:p[1]};if(p[0]==='dept')ta.departmentId=p[1];else ta.departmentId=staff(p[1]).deptId;hist(ta,ta.status,ta.status,'担当を設定：'+(p[0]==='dept'?deptName(p[1]):staffName(p[1])));log('担当を設定',ta.title);
      if(p[0]==='staff')notify(p[1],'業務：'+ta.title,u.name+'さんが担当に設定しました','#/tasks/'+ta.id,false);save();toast('担当を設定しました');}
    render();
  }else if(name==='return-target'){
    var x=byId(data.targets,id);var rsn=str('reason').trim();
    if(!rsn){ui.formErr={};ui.formErr['rx-'+id]='差し戻す理由を入力してください。本人の画面に表示されます';render();var e3=document.getElementById('rx-'+id);if(e3)e3.focus();return;}
    var inD=!!(ui.panel&&ui.panel.scope==='approvals');var idD=inD?approvalIndex(u,id):-1;
    returnTarget(x,rsn);save();ui.panel=inD?approvalPanelAt(u,idD):{requestId:x.requestId,targetId:x.id,mode:'review'};render();if(ui.panel)focusPanel();
  }else if(name==='proxy'){
    var xp=byId(data.targets,id);var pr=str('reason').trim();
    if(!pr){ui.formErr={px:'理由を入力してください'};render();return;}
    var r=reqOf(xp);
    if(!canManageRequest(u,r)){toast('代理で登録できるのは、依頼した人・確認する人・施設長・事務長です','error');render();return;}
    var version=data.submissions.filter(function(s){return s.targetId===xp.id;}).length+1;
    data.submissions.push({id:nid('sub'),targetId:xp.id,version:version,at:nowStamp(),byId:u.id,proxy:true,proxyReason:pr,fileName:r.fileMode==='no_file'?'':'（紙で受け取り）',fileSize:0,answer:r.fileMode==='no_file'?{examined:'yes',date:''}:null,comment:''});
    xp.status='submitted';xp.returnReason='';
    if(r.reviewerId!==u.id)notify(r.reviewerId,'確認の依頼：'+r.title,u.name+'さんが'+staffName(xp.staffId)+'さんの分を代理で登録しました','#/approvals',true);
    log('代理登録',r.title+'（'+staffName(xp.staffId)+'）');
    ui.panel={requestId:r.id,targetId:xp.id,mode:'review'};save();toast(staffName(xp.staffId)+'さんの分を代理で登録しました');render();
  }else if(name==='exclude'){
    var xe=byId(data.targets,id);var er=str('reason').trim();
    if(!er){ui.formErr={ex:'理由を入力してください'};render();return;}
    if(!canManageRequest(u,reqOf(xe))){toast('この操作はできません','error');render();return;}
    xe.status='excluded';xe.excludedReason=er;log('対象外に設定',reqOf(xe).title+'（'+staffName(xe.staffId)+'）');ui.panel=null;save();toast(staffName(xe.staffId)+'さんを対象外にしました');render();
  }else if(name==='flow-answer'){
    var fa=ui.flow[id]||(ui.flow[id]={step:2});var xq=byId(data.targets,id);var q2=qOf(reqOf(xq));var ex=str('examined');var dt=str('date');var errs={};
    if(!ex)errs.examined='「'+q2.yes+'」か「'+q2.no+'」を選んでください';
    else if(ex==='yes'&&!dt)errs.date=q2.date+'を入力してください';
    else if(ex==='yes'&&dt>today())errs.date=q2.date+'は今日までの日付にしてください';
    fa.answer={examined:ex,date:ex==='yes'?dt:''};
    if(Object.keys(errs).length){ui.formErr=errs;render();var fe=document.querySelector('.input-error')||document.querySelector('input[name=examined]');if(fe)fe.focus();return;}
    fa.step=(ex==='no')?'later':3;render();focusTitle();
  }else if(name==='flow-send'){
    var fs=ui.flow[id];var xs=byId(data.targets,id);
    if(!xs||xs.staffId!==u.id){render();return;}
    fs.comment=str('comment').trim();
    doSubmit(xs,{fileName:fs.fileName,fileSize:fs.fileSize,answer:fs.answer,comment:fs.comment});
    fs.step=4;save();render();focusTitle();
  }else if(name==='new-task'){
    var vals={kind:str('kind')||'task',title:str('title'),category:str('category'),assignee:str('assignee'),dueOn:str('dueOn'),requiresApproval:!!fd.get('requiresApproval'),description:str('description')};
    var res=createTask(vals);
    if(res&&!res._id){ui.formErr=res;ui.form=vals;render();var first=document.querySelector('.input-error');if(first)first.focus();return;}
    save();go('/tasks/'+res._id);
  }else if(name==='new-request'){
    var vr={title:str('title'),instructions:str('instructions'),dueOn:str('dueOn'),dataClass:str('dataClass'),target:str('target')||'all',reviewerId:str('reviewerId'),reminder:str('reminder')||'default'};
    var rq=createRequest(vr);
    if(rq&&!rq._id){ui.formErr=rq;ui.form=vr;render();var f0=document.querySelector('.input-error')||document.querySelector('input[name=dataClass]');if(f0)f0.focus();return;}
    save();go('/requests/'+rq._id);
  }
}

/* ---------------- 画面の組み立て ---------------- */
function parseRoute(){var h=location.hash.replace(/^#/,'')||'/';var parts=h.split('/').filter(Boolean);return {path:'/'+parts.join('/'),parts:parts};}
function isActive(r,p){if(p==='/')return r.path==='/';return r.path===p||r.path.indexOf(p+'/')===0;}
function protoBarHtml(){
  var opts=data.staff.filter(function(s){return s.hasLogin&&s.status==='active';}).map(function(s){return '<option value="'+s.id+'"'+(s.id===data.currentUserId?' selected':'')+'>'+esc(s.name)+'（'+esc(s.title)+'）</option>';}).join('');
  return '<span class="proto-label">試作品</span><span>架空のデータです</span>'+
    '<label>利用者 <select data-change="switch-user" aria-label="操作する人を切り替える">'+opts+'</select></label>'+
    '<span>今日：'+esc(fmtDate(today()))+(data.todayOffset?'（'+data.todayOffset+'日進めています）':'')+'</span>'+
    '<button type="button" class="pbtn" data-action="advance-day">1日進める</button>'+
    (data.todayOffset?'<button type="button" class="pbtn" data-action="reset-day">今日に戻す</button>':'')+
    (storageOK?'':'<span>この画面では保存されません</span>')+
    '<a href="#/about">この試作品について</a>';
}
function adminLayout(content,r){
  var u=me();var pend=myApprovals(u).count;var unread=unreadCount(u);
  var nav=[['/','ホーム'],['/tasks','業務'],['/requests','提出'],['/approvals','承認待ち（'+pend+'）'],['/notifications','通知（'+unread+'）'],['/audit','操作履歴']];
  return '<header class="site-header"><div class="wrap header-row"><div class="brand"><span class="brand-name">'+esc(data.facility.name)+'</span><span class="text-2">'+esc(u.name)+'（'+esc(u.title)+'）</span></div>'+
    '<nav aria-label="メインメニュー" class="main-nav">'+nav.map(function(n){return '<a href="#'+n[0]+'"'+(isActive(r,n[0])?' aria-current="page"':'')+'>'+esc(n[1])+'</a>';}).join('')+'</nav></div></header>'+
    '<main id="main" class="wrap main">'+toastHtml()+content+'</main>';
}
function staffLayout(content,r){
  var u=me();var unread=unreadCount(u);
  var tabs=[['/','ホーム',I.home],['/tasks','業務',I.list],['/requests','提出',I.upload],['/notifications','通知（'+unread+'）',I.bell]];
  return '<div class="staff-shell"><header class="staff-header"><div class="row-between text-2"><span>'+esc(u.name)+'さん</span><span>'+esc(fmtDate(today()))+'</span></div></header>'+
    '<main id="main" class="staff-main">'+toastHtml()+content+'</main>'+
    '<nav class="tabbar no-print" aria-label="下部メニュー">'+tabs.map(function(t){return '<a href="#'+t[0]+'"'+(isActive(r,t[0])?' aria-current="page"':'')+'>'+t[2]+'<span>'+esc(t[1])+'</span></a>';}).join('')+'</nav></div>';
}
function buildContent(r){
  var p=r.parts;var u=me();var isStaff=u.role==='STAFF';
  if(p.length===0)return isStaff?viewStaffHome(u):viewDashboard(u);
  if(p[0]==='tasks'&&p.length===1)return isStaff?viewStaffTasks(u):viewTasks(u);
  if(p[0]==='tasks'&&p[1]==='new')return isStaff?forbidden():viewTaskForm(u);
  if(p[0]==='tasks')return viewTaskDetail(u,p[1]);
  if(p[0]==='requests'&&p.length===1)return isStaff?viewStaffSubmissions(u):viewRequests(u);
  if(p[0]==='requests'&&p[1]==='new')return isStaff?forbidden():viewRequestForm(u);
  if(p[0]==='requests'&&p[2]==='print')return isStaff?forbidden():viewPrint(u,p[1]);
  if(p[0]==='requests')return isStaff?forbidden():viewStatusTable(u,p[1]);
  if(p[0]==='submit')return viewSubmitFlow(u,p[1]);
  if(p[0]==='approvals')return isStaff?forbidden():viewApprovals(u);
  if(p[0]==='notifications')return viewNotifications(u);
  if(p[0]==='audit')return isStaff?forbidden():viewAudit(u);
  if(p[0]==='about')return viewAbout(u);
  return notFound();
}
function render(){
  if(!me()){var first=data.staff.filter(function(s){return s.hasLogin&&s.status==='active';})[0];data.currentUserId=first.id;}
  var activeId=document.activeElement&&document.activeElement.id;
  var r=parseRoute();
  var navChanged=r.path!==ui.lastPath;
  if(navChanged){
    if(ui.toast&&ui.toast.path!==null&&ui.toast.path!==r.path)ui.toast=null;
    if(ui.lastPath!==null){ui.panel=null;ui.formErr=null;ui.form=null;}
  }
  var content=buildContent(r);
  protoBar.innerHTML=protoBarHtml();
  var u=me();
  app.innerHTML=u.role==='STAFF'?staffLayout(content,r):adminLayout(content,r);
  dialogRoot.innerHTML=dialogHtml();
  app.inert=!!ui.dialog;protoBar.inert=!!ui.dialog;
  if(ui.toast){live.textContent=ui.toast.text;if(ui.toast.path===null)ui.toast.path=r.path;}
  ui.lastPath=r.path;
  if(ui.dialog){var b=dialogRoot.querySelector('[data-autofocus]');if(b)b.focus();}
  else if(navChanged){window.scrollTo(0,0);focusTitle();}
  else if(activeId){var el=document.getElementById(activeId);if(el)el.focus();}
}

/* ---------------- イベント ---------------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-action]');
  if(!el)return;
  var a=el.getAttribute('data-action');
  if(a!=='goto-filter'&&a!=='flow-finish'&&el.tagName==='A')e.preventDefault();
  handleAction(a,el);
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();
  handleForm(f.getAttribute('data-form'),f,new FormData(f));
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.matches('[data-change="switch-user"]')){
    data.currentUserId=el.value;save();
    ui={toast:null,flow:{},filter:{},selected:{},panel:null,formErr:null,form:null,dialog:null,lastPath:null};
    toast(staffName(el.value)+'さんに切り替えました');
    if(location.hash==='#/'||location.hash===''){render();}else{location.hash='/';}
  }else if(el.matches('input[type=file][data-flow]')){
    var id=el.getAttribute('data-flow');var file=el.files&&el.files[0];
    var f=ui.flow[id]||(ui.flow[id]={step:2});
    if(!file){ui.formErr={file:'写真またはファイルを選んでください'};render();return;}
    if(file.size>25*1024*1024){ui.formErr={file:'ファイルを送れません。大きさが 25MB を超えています。写真を撮り直すか、小さいファイルを選んでください'};render();return;}
    f.fileName=file.name;f.fileSize=file.size;f.step=3;ui.formErr=null;render();focusTitle();
  }else if(el.matches('input[data-select]')){
    var scope=el.getAttribute('data-select');var list=ui.selected[scope]||(ui.selected[scope]=[]);
    var i=list.indexOf(el.value);
    if(el.checked&&i<0)list.push(el.value);
    if(!el.checked&&i>=0)list.splice(i,1);
    render();
  }
});
document.addEventListener('keydown',function(e){
  if(!ui.dialog)return;
  if(e.key==='Escape'){e.preventDefault();closeDialog();return;}
  if(e.key==='Tab'){
    var f=dialogRoot.querySelectorAll('button');if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(!dialogRoot.contains(document.activeElement)){e.preventDefault();first.focus();}
    else if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }
});
window.addEventListener('hashchange',render);

load();
runDailyJobs();
render();
})();
</script>
</body>
